<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F6F5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Evolução Pessoal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: caderno de bordo — cabeçalho fino, coluna única de até 760px, abas fixas embaixo (polegar no celular) */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --ink:#13201B; --muted:#56665F; --line:#D3DDD8; --soft:#E2EBE7;
  --accent:#1F6F5C; --on-accent:#FFFFFF; --warn:#A8640F; --bad:#B3412E; --good:#2E7A3B;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161F1C; --ink:#E4EDE9; --muted:#93A49E; --line:#2A3732; --soft:#1C2925;
  --accent:#5BC0A3; --on-accent:#06211A; --warn:#E2A04A; --bad:#E3806C; --good:#72C482; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1C; --ink:#E4EDE9; --muted:#93A49E; --line:#2A3732; --soft:#1C2925;
  --accent:#5BC0A3; --on-accent:#06211A; --warn:#E2A04A; --bad:#E3806C; --good:#72C482; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:700 20px/1.05 var(--f-display);letter-spacing:-.01em}
.brand small{display:block;font:500 10.5px/1.4 var(--f-mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.iconbtn{background:none;border:1px solid var(--line);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;color:var(--ink);cursor:pointer}
.iconbtn svg{width:20px;height:20px}
main{max-width:760px;margin:0 auto;padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{flex:1;max-width:150px;background:none;border:0;border-top:3px solid transparent;color:var(--muted);font:700 11.5px/1.2 var(--f-body);padding:9px 2px 11px;display:grid;justify-items:center;gap:3px;cursor:pointer}
.tabs button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
.tabs svg,.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.015em}
h1{font-size:30px;line-height:1.08}
h2{font-size:20px;line-height:1.2}
h3{font-size:16px;line-height:1.3}
p{margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}
.hero{display:grid;gap:10px;padding-block:4px}
.eyebrow{font:500 11px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{padding:12px;border-radius:10px;background:var(--soft);display:grid;gap:2px;min-width:0}
.stat b{font:500 21px/1.15 var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.chip.ok{color:var(--good)} .chip.warn{color:var(--warn)} .chip.bad{color:var(--bad)}
.chip.acc{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.stack{display:grid;gap:8px}
.btn{font:700 14px/1 var(--f-body);border-radius:10px;padding:11px 14px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:7px 10px;font-size:13px}
.btn.danger{border-color:var(--bad);background:transparent;color:var(--bad)}
.linkbtn{background:none;border:0;color:var(--accent);font:700 13px var(--f-body);cursor:pointer;padding:4px 0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
form.stack{gap:12px}
label.f{display:grid;gap:4px;font-size:14px;font-weight:700;min-width:0}
label.f .h{font-weight:400;color:var(--muted);font-size:12.5px}
input,select,textarea{font:16px/1.3 var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px;width:100%;min-width:0}
textarea{min-height:110px;font-family:var(--f-mono);font-size:12.5px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;cursor:pointer}
.check input{width:auto;margin-top:4px}
.chips-sel{display:flex;flex-wrap:wrap;gap:6px}
.chips-sel label{cursor:pointer;position:relative}
.chips-sel input{position:absolute;opacity:0;width:1px;height:1px}
.chips-sel span{display:inline-block;padding:6px 10px;border-radius:99px;border:1px solid var(--line);font-size:13px;background:var(--bg)}
.chips-sel input:checked+span{background:var(--bad);color:var(--surface);border-color:var(--bad);text-decoration:line-through}
.chips-sel input:focus-visible+span{outline:3px solid var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over i{background:var(--bad)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:500 10.5px/1.3 var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.r{text-align:right}
.meal{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:6px}
.meal:first-child{border-top:0;padding-top:0}
.item{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.item .q{font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ex{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:8px}
.ex:first-child{border-top:0;padding-top:0}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sets{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:center;max-width:340px}
.sets input{padding:8px}
.sets .l{font:500 12px var(--f-mono);color:var(--muted)}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}
.note{border-left:3px solid var(--warn);padding:8px 12px;background:var(--soft);border-radius:0 8px 8px 0;font-size:14px}
.note.info{border-left-color:var(--accent)}
.note.bad{border-left-color:var(--bad)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:7px 12px;font:700 13px var(--f-body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.week div{border:1px solid var(--line);border-radius:8px;padding:6px 2px;text-align:center;font-size:12px;display:grid;gap:2px}
.week div b{font:500 15px var(--f-mono)}
.week .today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.week .off b{color:var(--muted)}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:700}
.tag{font:500 10.5px var(--f-mono);padding:2px 6px;border-radius:5px;background:var(--soft);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.list{display:grid;gap:0}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.li:last-child{border-bottom:0}
.li .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:4px 6px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--f-mono)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{stroke:var(--accent);stroke-width:2.2;fill:none}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .dt{fill:var(--accent)}
#timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--ink);color:var(--bg);border-radius:99px;padding:10px 16px;font:500 15px var(--f-mono);display:flex;gap:12px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#timer button{background:none;border:0;color:inherit;font:700 13px var(--f-body);cursor:pointer;text-decoration:underline}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));z-index:8;background:var(--accent);color:var(--on-accent);padding:9px 16px;border-radius:10px;font-weight:700;font-size:14px;max-width:calc(100% - 32px)}
.refs li{margin-bottom:6px;font-size:14px}
a{color:var(--accent)}
@media (min-width:640px){h1{font-size:36px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
"use strict";
/* =========================================================

   Os dados ficam no navegador (localStorage). Faça backup em Ajustes.
   Para editar: alimentos em FOODS, treinos em PROG, categorias em CATS.
   ========================================================= */

const KEY = 'evolucao-pessoal.v1';
const hoje = () => new Date().toLocaleDateString('sv-SE');
const mesAtual = () => hoje().slice(0, 7);
const brl = v => (+v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const n0 = v => Math.round(+v || 0).toLocaleString('pt-BR');
const n1 = v => (+v || 0).toLocaleString('pt-BR', { maximumFractionDigits: 1 });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const num = v => (v === null || v === undefined || v === '') ? null : (isNaN(+String(v).replace(',', '.')) ? null : +String(v).replace(',', '.'));
const diasEntre = (a, b) => Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / 864e5);
const fmtData = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : '';
const mesesDesde = iso => { if (!iso) return 0; const [y1, m1] = iso.split('-').map(Number); const [y2, m2] = hoje().split('-').map(Number); return (y2 - y1) * 12 + (m2 - m1); };
const hash = s => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return Math.abs(h); };
const nomeMes = m => { const [y, mm] = m.split('-').map(Number); return new Date(y, mm - 1, 15).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }); };
const addMes = (m, d) => { const [y, mm] = m.split('-').map(Number); const t = new Date(y, mm - 1 + d, 15); return t.toLocaleDateString('sv-SE').slice(0, 7); };

/* ---------------- Estado ---------------- */
const DEFAULT = {
  onboarded: false, perfil: {}, treino: {}, fin: { metas: [] },
  logs: { treinos: [], corpo: [], gastos: [], lactose: {}, reintro: [], fixosLancados: [] },
  ui: { tab: 'hoje', mes: null, swaps: {}, treinoSel: null }
};
function load() {
  try {
    const r = JSON.parse(localStorage.getItem(KEY));
    if (r) return merge(r);
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT));
}
function merge(r) {
  const d = JSON.parse(JSON.stringify(DEFAULT));
  return { ...d, ...r, fin: { ...d.fin, ...(r.fin || {}) }, logs: { ...d.logs, ...(r.logs || {}) }, ui: { ...d.ui, ...(r.ui || {}) } };
}
let S = load();
let storageOk = true;
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true; } catch (e) { storageOk = false; } }

function statusBio(k, v, entrada) {

  const faixa = (lims, rots) => { for (let i = 0; i < lims.length; i++) if (v < lims[i]) return rots[i]; return rots[rots.length - 1]; };
  const B = ['Baixo', 'warn'], OK = ['Saudável', 'ok'], A = ['Alto', 'warn'], MA = ['Muito alto', 'bad'], EX = ['Excelente', 'ok'];
  switch (k) {

    case 'gordura': return f ? faixa([21, 31, 36], [B, OK, A, MA]) : faixa([11, 21, 26], [B, OK, A, MA]);
    case 'gorduraKg': { const pct = entrada && entrada.peso ? v / entrada.peso * 100 : null; return pct ? statusBio('gordura', pct) : null; }
    case 'mmePct': return f ? faixa([30, 36], [B, OK, EX]) : faixa([40, 46], [B, OK, EX]);
    case 'mmeKg': { const pct = entrada && entrada.peso ? v / entrada.peso * 100 : null; return pct ? statusBio('mmePct', pct) : null; }
    case 'visceral': return faixa([10, 15], [OK, A, MA]);

function gordura() {
  const p = S.perfil, u = ultimoCorpo() || {};
  const h = +p.altura || 170, idade = +p.idade || 30, peso = pesoAtual();
  const bio = ultimoBio();
  if (bio && bio.gordura) return { bf: +bio.gordura, metodo: `bioimpedância de ${fmtData(bio.data)}` };
  const fita = [...S.logs.corpo].filter(x => x.cintura).sort((a, b) => a.data.localeCompare(b.data)).pop() || u;
  const c = +(fita.cintura || p.cintura), nk = +(fita.pescoco || p.pescoco), q = +(fita.quadril || p.quadril);
  if (c && nk && p.sexo === 'm' && c - nk > 0)
    return { bf: 495 / (1.0324 - 0.19077 * Math.log10(c - nk) + 0.15456 * Math.log10(h)) - 450, metodo: 'fórmula da Marinha dos EUA (cintura e pescoço)' };
  if (c && nk && q && p.sexo === 'f' && c + q - nk > 0)
    return { bf: 495 / (1.29579 - 0.35004 * Math.log10(c + q - nk) + 0.221 * Math.log10(h)) - 450, metodo: 'fórmula da Marinha dos EUA (cintura, quadril e pescoço)' };
  if (p.gordura) return { bf: +p.gordura, metodo: 'informado no questionário' };
  const imc = peso / ((h / 100) ** 2);
  return { bf: 1.2 * imc + 0.23 * idade - 10.8 * (p.sexo === 'm' ? 1 : 0) - 5.4, metodo: 'estimativa pelo IMC (pouco precisa; meça cintura e pescoço)' };
}

function decidirObjetivo(bf, sexo, exp, medida) {
  const k = sexo === 'f' ? 8 : 0, G = medida ? 'Gordura medida em' : 'Gordura estimada em';
  if (bf >= 22 + k) return { obj: 'cut', motivo: `${G} ${n1(bf)}%. Acima de ${22 + k}%, reduzir gordura primeiro deixa o ganho de massa posterior mais eficiente e melhora a sensibilidade à insulina.` };
  if (bf >= 15 + k) {
    if (exp === 'ini') return { obj: 'recomp', motivo: `${G} ${n1(bf)}% e pouco tempo de treino: iniciantes nessa faixa conseguem ganhar músculo e perder gordura ao mesmo tempo, comendo perto da manutenção e com proteína alta.` };
    return { obj: 'cut', motivo: `${G} ${n1(bf)}%. Um cutting moderado até ~${15 + k}% abre espaço para um bulking mais longo e limpo depois.` };
  }
  return { obj: 'bulk', motivo: `${G} ${n1(bf)}%, faixa boa para ganhar massa. Superávit leve: excesso de calorias vira gordura, não músculo.` };
}

function plano() {
  const p = S.perfil, peso = pesoAtual(), h = +p.altura || 170, idade = +p.idade || 30;
  const { bf, metodo } = gordura();
  const bio = ultimoBio();
  const mif = 10 * peso + 6.25 * h - 5 * idade + (p.sexo === 'f' ? -161 : 5);
  const mm = bio && bio.lbm ? +bio.lbm : peso * (1 - bf / 100);
  const katch = 370 + 21.6 * mm;
  const medido = !metodo.startsWith('estimativa');
  let tmb, tmbFonte;
  if (bio && bio.tmbBio) { tmb = +bio.tmbBio; tmbFonte = `medido na bioimpedância de ${fmtData(bio.data)}`; }
  else if (medido) { tmb = (mif + katch) / 2; tmbFonte = 'média de Mifflin-St Jeor e Katch-McArdle (pela massa magra)'; }
  else { tmb = mif; tmbFonte = 'fórmula de Mifflin-St Jeor'; }
  const get = tmb * (+p.atividade || 1.375);
  const sug = decidirObjetivo(bf, p.sexo, S.treino.experiencia, metodo.startsWith('bioimped'));
  if (bio && bio.mmePct) { const st = statusBio('mmePct', +bio.mmePct); sug.motivo += ` Massa muscular esquelética de ${n1(bio.mmePct)}%${st ? ` (${st[0].toLowerCase()})` : ''}.`; }
  const obj = (p.objetivo && p.objetivo !== 'auto') ? p.objetivo : sug.obj;
  const motivo = (p.objetivo && p.objetivo !== 'auto' && p.objetivo !== sug.obj) ? `Você escolheu ${OBJ[obj].toLowerCase()}. Pelos seus dados, a sugestão seria ${OBJ[sug.obj].toLowerCase()}: ${sug.motivo}` : sug.motivo;
  const fator = { cut: 0.8, recomp: 0.95, bulk: 1.1, manter: 1 }[obj];
  const ajuste = +p.ajusteKcal || 0;
  const kcal = Math.round((get * fator + ajuste) / 50) * 50;
  let protKg = { cut: 2.2, recomp: 2.0, bulk: 1.8, manter: 1.6 }[obj];
  if (p.dieta === 'vegana') protKg = Math.min(2.4, protKg + 0.2);
  const baseProt = bf > (p.sexo === 'f' ? 35 : 28) ? mm / 0.8 : peso; // em gordura alta, usa peso ajustado
  const prot = Math.round(protKg * baseProt);
  let fat = Math.round(kcal * 0.25 / 9);
  let carb = Math.round((kcal - prot * 4 - fat * 9) / 4);
  if (carb < 100) { fat = Math.round(kcal * 0.2 / 9); carb = Math.round((kcal - prot * 4 - fat * 9) / 4); }
  return { peso, bf, metodo, tmb, tmbFonte, mm, get, obj, motivo, kcal, prot, fat, carb: Math.max(carb, 50), protKg, fator, ajuste, baseProt };
}

/* ---------------- Gerador de cardápio ---------------- */
const SLOTS = { 3: ['cafe', 'almoco', 'jantar'], 4: ['cafe', 'almoco', 'lanche', 'jantar'], 5: ['cafe', 'lanche1', 'almoco', 'lanche2', 'jantar'], 6: ['cafe', 'lanche1', 'almoco', 'lanche2', 'jantar', 'ceia'] };
const SLOTNOME = { cafe: 'Café da manhã', lanche1: 'Lanche da manhã', almoco: 'Almoço', lanche: 'Lanche da tarde', lanche2: 'Lanche da tarde', jantar: 'Jantar', ceia: 'Ceia' };
function porcao(f, q) {
  const r = f.por >= 50 ? 10 : 5;
  q = Math.max(r, Math.round(q / r) * r);
  if (f.max) q = Math.min(q, f.max);
  const k = q / f.por;
  return { f, q, kcal: f.kcal * k, p: f.p * k, c: f.c * k, fat: f.fat * k, lac: f.lac * k };
}
function tot(itens) { return itens.reduce((a, i) => ({ kcal: a.kcal + i.kcal, p: a.p + i.p, c: a.c + i.c, fat: a.fat + i.fat, lac: a.lac + i.lac }), { kcal: 0, p: 0, c: 0, fat: 0, lac: 0 }); }
function gerarDia(data) {
  const pl = plano(), n = clamp(+S.perfil.refeicoes || 4, 3, 6), slots = SLOTS[n];
  const pesoC = slots.map(s => (s === 'almoco' || s === 'jantar') ? 1.4 : s === 'cafe' ? 1.1 : 0.8);
  const somaC = pesoC.reduce((a, b) => a + b, 0);
  const al = alimentosPermitidos();
  return slots.map((s, i) => {
    const tipo = (s === 'almoco' || s === 'jantar') ? 'a' : 'm';
    const seed = hash(data + s) + (S.ui.swaps[data + s] || 0) * 7;
    const alvo = { p: pl.prot / n, c: pl.carb * pesoC[i] / somaC, fat: pl.fat / n };
    const pick = (cat, k) => {
      let l = al.filter(f => f.cat === cat && f.t.includes(tipo));
      if (!l.length) l = al.filter(f => f.cat === cat);
      return l.length ? l[(seed + k) % l.length] : null;
    };
    const itens = [];
    const lado = pick(tipo === 'a' ? 'veg' : 'fruta', 3);
    if (lado) itens.push(porcao(lado, lado.por));
    if (tipo === 'a') { const v2 = pick('veg', 11); if (v2 && v2 !== lado) itens.push(porcao(v2, v2.por)); }
    const pr = pick('prot', 0);
    if (pr) { const need = Math.max(alvo.p * 0.85 - tot(itens).p, alvo.p * 0.5); itens.push(porcao(pr, clamp(need / pr.p * pr.por, pr.por * 0.5, pr.max || pr.por * 2.5))); }
    const cb = pick('carb', 5);
    if (cb) { const need = alvo.c - tot(itens).c; if (need > 8) itens.push(porcao(cb, clamp(need / cb.c * cb.por, cb.por * 0.4, cb.max || cb.por * 3))); }
    const ft = pick('gord', 2);
    if (ft) { const need = alvo.fat - tot(itens).fat; if (need > 3) itens.push(porcao(ft, clamp(need / ft.fat * ft.por, ft.por * 0.5, ft.max || ft.por * 2.5))); }
    return { slot: s, nome: SLOTNOME[s], itens, tot: tot(itens), alvo };
  });
}

}

function programa() {
  const t = S.treino, exp = t.experiencia || 'inter', casa = t.local === 'casa', curto = +t.tempo && +t.tempo <= 45, rs = t.restricoes || [];
  const out = {};
  for (const [id, tr] of Object.entries(PROG)) {
    out[id] = { id, nome: tr.nome, ex: tr.ex.map((e, i) => {
      const x = { ...e, id: id + i, obs: [] };
      if (casa && e.casa) { x.n = e.casa; x.obs.push('versão para casa'); }
      const hit = (e.risk || []).filter(k => rs.includes(k));
      if (hit.length && e.seguro) { x.n = e.seguro; x.obs.push('trocado por causa de ' + hit.join(' e ')); }
      if (exp === 'ini') {
        if (x.m === 'fst7') { x.sets = 3; x.int = 60; x.tec = '3 séries normais com 2–3 repetições em reserva. O FST-7 entra quando você tiver mais de 6 meses de treino.'; }
        else if (x.m) x.tec = '2–3 repetições em reserva, sem drop set ou pirâmide por enquanto';
        else x.tec = x.tec.replace(/Próximo da falha|Até a falha/g, '2–3 repetições em reserva');
        x.m = null; x.sets = Math.min(x.sets, 3);
      }
      if (curto) { x.sets = x.m === 'fst7' ? 4 : Math.min(x.sets, 3); }
      return x;
    }) };
  }
  return out;
}
function treinosAtivos() { const d = clamp(+S.treino.dias || 5, 3, 5); return [...new Set(SEMANA[d].filter(Boolean))].sort(); }
function treinoDoDia() { const d = clamp(+S.treino.dias || 5, 3, 5); return SEMANA[d][(new Date().getDay() + 6) % 7]; }
function ultimaSerie(exId) {
  const L = S.logs.treinos.filter(s => s.ex && s.ex[exId] && s.ex[exId].length).sort((a, b) => a.data.localeCompare(b.data));
  const u = L[L.length - 1];
  return u ? { data: u.data, sets: u.ex[exId] } : null;
}
function sugestao(ex) {
  const u = ultimaSerie(ex.id);
  if (!u) return { kg: null, txt: 'Primeira vez: escolha uma carga que deixe 2 repetições em reserva.' };
  const kgs = u.sets.map(s => +s.kg || 0), reps = u.sets.map(s => +s.reps || 0);
  const kg = Math.max(...kgs), [mn, mx] = ex.f;
  const hist = `Última (${fmtData(u.data)}): ${n1(kg)} kg × ${reps.join(', ')}`;
  if (ex.m === 'piramide') return { kg, txt: `${hist}. Na pirâmide, suba a carga da 1ª série quando fizer 8 limpas.` };
  if (reps.every(r => r >= mx) && kg > 0) {
    const novo = Math.max(kg + 1, Math.round(kg * 1.075));
    return { kg: novo, txt: `${hist}. Bateu o topo da faixa em todas: suba para ~${novo} kg (+5 a 10%).`, up: true };
  }
  if (reps.some(r => r < mn)) return { kg, txt: `${hist}. Ficou abaixo de ${mn} reps: mantenha a carga até completar a faixa.` };
  return { kg, txt: `${hist}. Mantenha a carga e busque mais repetições.` };
}

/* ---------- Cartões e faturas ----------
   Cada lançamento guarda a data da COMPRA. O mês em que ele pesa no orçamento
   é o mês em que o dinheiro sai da conta:
   - conta, Pix, débito ou dinheiro: o próprio mês da compra;
   - cartão: o mês de vencimento da fatura em que a compra cai.
   Compra a partir do dia de fechamento vai para a fatura seguinte.
   Parcelado: cada parcela cai numa fatura, uma por mês. */
const cartoes = () => (S.fin.cartoes || []).filter(c => c.nome && c.fecha && c.vence);
const cartaoPor = id => cartoes().find(c => c.id === id);
const diaVenc = (m, d) => { const [y, mm] = m.split('-').map(Number); const ult = new Date(y, mm, 0).getDate(); return `${m}-${String(Math.min(d, ult)).padStart(2, '0')}`; };
function mesFatura(dataCompra, c) {
  const dia = +dataCompra.slice(8, 10);
  let mFecha = dataCompra.slice(0, 7);
  if (dia >= +c.fecha) mFecha = addMes(mFecha, 1);
  return +c.vence > +c.fecha ? mFecha : addMes(mFecha, 1);
}
/* Mês da fatura que está aberta hoje (recebendo compras) */
const faturaAberta = c => mesFatura(hoje(), c);
const fechamentoDe = (mVenc, c) => diaVenc(+c.vence > +c.fecha ? mVenc : addMes(mVenc, -1), +c.fecha);
function ocorrencias() {
  const out = [];
  for (const g of S.logs.gastos) {
    const c = g.pg && g.pg !== 'conta' ? cartaoPor(g.pg) : null;
    const n = c ? clamp(+g.parc || 1, 1, 48) : 1;
    const m0 = c ? mesFatura(g.data, c) : g.data.slice(0, 7);
    for (let i = 0; i < n; i++) {
      const mes = addMes(m0, i);
      out.push({ ...g, mes, valor: Math.round(g.valor / n * 100) / 100, total: g.valor, parcela: n > 1 ? `${i + 1}/${n}` : '', cartao: c, venc: c ? diaVenc(mes, +c.vence) : g.data });
    }
  }
  return out;
}
function resumoMes(m) {
  const f = S.fin, renda = +f.renda || 0, met = METODOS[f.metodo] || METODOS['50/30/20'];
  const g = ocorrencias().filter(x => x.mes === m);
  const por = {}, grp = { ess: 0, des: 0, fut: 0 };
  for (const x of g) { por[x.cat] = (por[x.cat] || 0) + x.valor; grp[(CATMAP[x.cat] || CATMAP.outros).g] += x.valor; }
  const orc = { ess: renda * met.ess / 100, des: renda * met.des / 100, fut: renda * met.fut / 100 };
  const cartao = g.filter(x => x.cartao).reduce((a, x) => a + x.valor, 0);
  return { renda, met, g, por, grp, orc, cartao, consumo: grp.ess + grp.des, livre: renda - grp.ess - grp.des - grp.fut };
}
function fixosTotal() { const fx = S.fin.fixos || {}; return Object.values(fx).reduce((a, b) => a + (+b || 0), 0); }
function reserva() {
  const oc = ocorrencias(), meses = [...new Set(oc.map(x => x.mes))].filter(m => m <= mesAtual());
  const essMed = meses.length ? meses.map(m => resumoMes(m).grp.ess).reduce((a, b) => a + b, 0) / meses.length : 0;
  const base = Math.max(essMed, fixosTotal());
  const atual = (+S.fin.reservaAtual || 0) + oc.filter(x => x.cat === 'reserva' && x.mes <= mesAtual()).reduce((a, x) => a + x.valor, 0);
  return { alvo: base * 6, atual, base };
}
/* Texto que diz onde uma compra vai cair */
function ondeCai(data, pg, parc) {
  const c = pg && pg !== 'conta' ? cartaoPor(pg) : null;
  if (!c || !data) return data ? `Sai da conta em ${nomeMes(data.slice(0, 7))}.` : '';
  const m = mesFatura(data, c), n = clamp(+parc || 1, 1, 48);

}

/* ---------------- Progresso ---------------- */
function tendencia() {
  const L = S.logs.corpo.filter(x => x.peso && diasEntre(x.data, hoje()) <= 28).sort((a, b) => a.data.localeCompare(b.data));
  if (L.length < 3 || diasEntre(L[0].data, L[L.length - 1].data) < 10) return null;
  const xs = L.map(x => diasEntre(L[0].data, x.data)), ys = L.map(x => +x.peso);
  const mx = xs.reduce((a, b) => a + b) / xs.length, my = ys.reduce((a, b) => a + b) / ys.length;
  const slope = xs.reduce((a, x, i) => a + (x - mx) * (ys[i] - my), 0) / xs.reduce((a, x) => a + (x - mx) ** 2, 0);
  return { kgSem: slope * 7, pctSem: slope * 7 / my * 100, n: L.length };
}
function avaliarTendencia(t, obj) {
  const fx = { cut: [-1.0, -0.5], bulk: [0.1, 0.35], recomp: [-0.3, 0.1], manter: [-0.2, 0.2] }[obj];
  const passo = obj === 'cut' || obj === 'bulk' ? 150 : 100;
  const ritmo = `${t.pctSem >= 0 ? '+' : ''}${n1(t.pctSem)}% do peso por semana`;
  const faixa = `faixa ideal: ${fx[0] >= 0 ? '+' : ''}${n1(fx[0])}% a ${fx[1] >= 0 ? '+' : ''}${n1(fx[1])}%`;
  if (t.pctSem < fx[0]) return { st: 'warn', delta: +passo, m: obj === 'cut' ? `Você está perdendo peso rápido demais (${ritmo}; ${faixa}). Isso aumenta a perda de músculo.` : `Seu peso está ${t.pctSem < 0 ? 'caindo' : 'subindo devagar'} (${ritmo}; ${faixa}).` };
  if (t.pctSem > fx[1]) return { st: 'warn', delta: -passo, m: obj === 'bulk' ? `Ganho acima do ideal (${ritmo}; ${faixa}). O excesso tende a virar gordura.` : obj === 'cut' ? `A perda está lenta (${ritmo}; ${faixa}).` : `Seu peso está subindo mais que o esperado (${ritmo}; ${faixa}).` };
  return { st: 'ok', delta: 0, m: `Ritmo de ${t.pctSem >= 0 ? '+' : ''}${n1(t.pctSem)}% por semana, dentro da faixa do seu objetivo. Mantenha.` };
}

function lineChart(pts, unit) {
  if (pts.length < 2) return '<p class="muted small">Registre pelo menos duas medições para ver o gráfico.</p>';
  const W = 640, H = 190, pl = 44, pr = 14, pt = 12, pb = 26;
  const ys = pts.map(p => p.y); let lo = Math.min(...ys), hi = Math.max(...ys);
  const pad = Math.max((hi - lo) * 0.15, 0.5); lo -= pad; hi += pad;
  const t0 = new Date(pts[0].x + 'T12:00').getTime(), t1 = new Date(pts[pts.length - 1].x + 'T12:00').getTime() || t0 + 1;
  const X = d => pl + (W - pl - pr) * ((new Date(d + 'T12:00').getTime() - t0) / Math.max(1, t1 - t0));
  const Y = v => pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo));
  const ticks = [lo + (hi - lo) * 0.1, (lo + hi) / 2, hi - (hi - lo) * 0.1];
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');
  const area = `${d} L${X(pts[pts.length - 1].x).toFixed(1)},${H - pb} L${X(pts[0].x).toFixed(1)},${H - pb} Z`;
  const last = pts[pts.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de ${unit}">
    ${ticks.map(t => `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${pl - 6}" y="${Y(t) + 4}" text-anchor="end">${n1(t)}</text>`).join('')}
    <path class="ar" d="${area}"/><path class="ln" d="${d}"/>
    ${pts.map(p => `<circle class="dt" cx="${X(p.x)}" cy="${Y(p.y)}" r="2.6"/>`).join('')}
    <circle class="dt" cx="${X(last.x)}" cy="${Y(last.y)}" r="5"/>
    <text x="${pl}" y="${H - 6}">${fmtData(pts[0].x)}</text><text x="${W - pr}" y="${H - 6}" text-anchor="end">${fmtData(last.x)}</text>
  </svg>`;
}

function startWizard(ids) { wiz = { ids: ids || STEPS.map(s => s.id), i: 0 }; render(); window.scrollTo(0, 0); }

    if (r.grp.ess > r.orc.ess) insights.push({ t: 'warn', m: `Os essenciais estão em ${n0(r.grp.ess / r.renda * 100)}% da renda (meta: ${r.met.ess}%). Se for sempre assim, o método 60/20/20 é mais realista para você.` });

  const cs = cartoes(), oc = ocorrencias();

    <div class="stack">${['ess', 'des', 'fut'].map(k => `<div class="row between small"><span>${GRUPOFIN[k]} · meta ${r.met[k]}%</span><span class="num">${brl(r.grp[k])} / ${brl(r.orc[k])}</span></div>${k === 'fut' ? bar(r.grp[k], r.orc[k]).replace('over', '') : bar(r.grp[k], r.orc[k])}`).join('')}</div>

  <form class="panel stack" data-form="gasto"><h2>Novo lançamento</h2><div class="grid2">
    ${fNum('valor', 'Valor total (R$)', '', { req: 1, min: 0.01, step: 0.01 })}${fTxt('desc', 'Descrição', '', { ph: 'Ex.: iFood sexta' })}
    ${fSel('cat', 'Categoria', CATS.filter(c => c[0] !== 'cartaoini').map(([id, n, g]) => [id, `${n} · ${GRUPOFIN[g]}`]), 'mercado')}${fTxt('data', 'Data da compra', dataPadrao, { type: 'date' })}
    ${fSel('pg', 'Como pagou', pgOpts, pgPadrao)}${fSel('parc', 'Parcelas', Array.from({ length: 24 }, (_, i) => [i + 1, i ? `${i + 1}x` : 'À vista']), 1, { h: 'só para cartão' })}</div>

  ${futuros.length ? `<section class="panel"><h2>Já comprometido</h2><p class="small muted">Parcelas e faturas que você já assumiu para os próximos meses.</p><div class="tw"><table><thead><tr><th>Mês</th><th class="r">No cartão</th><th class="r">% da renda</th></tr></thead><tbody>${futuros.map(x => `<tr><td>${nomeMes(x.mf)}</td><td class="r num">${brl(x.v)}</td><td class="r num">${r.renda ? n0(x.v / r.renda * 100) + '%' : '–'}</td></tr>`).join('')}</tbody></table></div></section>` : ''}
  <section class="panel"><h2>Por categoria</h2>${cats.length ? `<div class="tw"><table><thead><tr><th>Categoria</th><th class="r">Valor</th><th class="r">% renda</th></tr></thead><tbody>${cats.map(([c, v]) => `<tr><td>${CATMAP[c].n}</td><td class="r num">${brl(v)}</td><td class="r num">${r.renda ? n1(v / r.renda * 100) + '%' : '–'}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted small">Nada a pagar neste mês ainda.</p>'}

  ${L.filter(x => x.cintura).length >= 2 ? `<section class="panel"><h2>Cintura</h2>${lineChart(L.filter(x => x.cintura).map(x => ({ x: x.data, y: +x.cintura })), 'cintura em cm')}<p class="small muted">No cutting e na recomposição, cintura caindo com peso estável é sinal de que você ganha músculo e perde gordura.</p></section>` : ''}
  <form class="panel stack" data-form="corpo"><h2>Nova medição</h2><div class="grid2">
    ${fTxt('data', 'Data', hoje(), { type: 'date' })}${fNum('peso', 'Peso (kg)', '', { req: 1, step: 0.1, ph: n1(u.peso || pesoAtual()) })}${fNum('cintura', 'Cintura (cm)', '', { step: 0.5, ph: u.cintura || '' })}${fNum('pescoco', 'Pescoço (cm)', '', { step: 0.5, ph: u.pescoco || '' })}
    ${S.perfil.sexo === 'f' ? fNum('quadril', 'Quadril (cm)', '', { step: 0.5, ph: u.quadril || '' }) : ''}</div>
    <details><summary>Dados da bioimpedância</summary><div style="margin-top:10px">${camposBio()}</div></details>
    <div><button class="btn" type="submit">Salvar medição</button></div><p class="small muted">Peso 2 a 3 vezes por semana, fita a cada 2 semanas e bioimpedância a cada 4 a 8 semanas, sempre em jejum e no mesmo horário.</p></form>
  ${L.length ? `<section class="panel"><h2>Registros</h2><div class="tw"><table><thead><tr><th>Data</th><th class="r">Peso</th><th class="r">Gordura</th><th class="r">Cintura</th><th class="r">Pescoço</th><th></th></tr></thead><tbody>${[...L].reverse().slice(0, 20).map(x => `<tr><td>${fmtData(x.data)}</td><td class="r num">${x.peso ? n1(x.peso) : '–'}</td><td class="r num">${x.gordura ? n1(x.gordura) + '%' : '–'}</td><td class="r num">${x.cintura ? n1(x.cintura) : '–'}</td><td class="r num">${x.pescoco ? n1(x.pescoco) : '–'}</td><td class="r"><button class="x linkbtn" data-act="rmCorpo" data-d="${x.data}" aria-label="Apagar">×</button></td></tr>`).join('')}</tbody></table></div></section>` : ''}`;
}

let confirmApagar = false;
function vAjustes() {
  return `<section class="hero"><p class="eyebrow">Ajustes</p><h1>Questionários e backup</h1></section>
  <section class="panel"><h2>Refazer questionários</h2><p class="small muted">Seus planos se recalculam na hora. Refaça quando mudar de fase no protocolo FODMAP, de rotina de treino ou de renda.</p>
    <div class="row"><button class="btn ghost" data-act="refazer" data-s="corpo,rotina,intestino">Saúde e alimentação</button><button class="btn ghost" data-act="refazer" data-s="treino">Treino</button><button class="btn ghost" data-act="refazer" data-s="fin">Finanças</button><button class="btn ghost" data-act="refazer" data-s="">Todos</button></div></section>
  <section class="panel"><h2>Backup</h2><p class="small muted">Os dados ficam só neste navegador. Baixe um backup de vez em quando e antes de trocar de celular.</p>
    <div class="row"><button class="btn" data-act="exportar">Baixar backup (.json)</button><button class="btn ghost" data-act="copiar">Copiar dados</button></div>
    <form class="stack" data-form="importar"><label class="f" for="f-imp">Restaurar backup<span class="h">cole o conteúdo do arquivo .json ou escolha o arquivo</span><textarea id="f-imp" name="json"></textarea></label>
    <input type="file" id="f-impfile" accept="application/json,.json" aria-label="Arquivo de backup"><div><button class="btn ghost" type="submit">Restaurar</button></div></form></section>
  <section class="panel"><h2>Base científica</h2><ul class="refs">
    <li>Costa & Rodrigues (2026). Hipertrofia muscular. <i>RCMOS</i>. Proteína de 1,6–2,2 g/kg, 20–40 g por refeição, gordura 20–35%, carga de 60–85% de 1RM, sono e recuperação.</li>
    <li>Yasuda et al. (2020). Distribuição uniforme de proteína em 3 refeições aumenta a hipertrofia. <i>J Nutr</i> 150(7). <a href="https://doi.org/10.1093/jn/nxaa101" target="_blank" rel="noopener">doi</a></li>
    <li>Ghafoor, Karunaratne & Rao (2022). Supercrescimento bacteriano e intolerância à lactose. <i>Curr Opin Clin Nutr Metab Care</i> 25(5). Tolerância de 12–15 g de lactose/dia.</li>
    <li>Federação Brasileira de Gastroenterologia (2025). Posicionamento sobre diagnóstico e tratamento do SIBO. <i>Arq Gastroenterol</i>.</li>
    <li>Chedid et al. (2024). Manejo dietético e clínico do SIBO, revisão narrativa. <i>MDPI Dietetics</i>. <a href="https://www.mdpi.com/2674-0311/5/1/10" target="_blank" rel="noopener">link</a></li>
    <li>Monash University. Protocolo low FODMAP em 3 fases e porções seguras de cada alimento. <a href="https://www.monashfodmap.com/" target="_blank" rel="noopener">monashfodmap.com</a></li>
    <li>Mifflin-St Jeor (1990) e Katch-McArdle para metabolismo basal; fórmula da Marinha dos EUA (Hodgdon & Beckett, 1984) para gordura corporal.</li>
    <li>Programa de treino ABCDE de uso pessoal (foco em peito e ombros).</li></ul></section>
  <section class="panel"><h2>Apagar tudo</h2><p class="small muted">Remove todos os dados deste navegador. Não dá para desfazer sem um backup.</p><div><button class="btn danger" data-act="apagar">${confirmApagar ? 'Toque de novo para apagar tudo' : 'Apagar todos os dados'}</button></div></section>`;
}

/* ---------------- Render e eventos ---------------- */
const TABS = [
  ['hoje', 'Hoje', '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>'],
  ['dieta', 'Dieta', '<path d="M6 3v7a3 3 0 0 0 6 0V3M9 3v18M17 3c-2 2-3 5-3 8h3v10"/>'],
  ['treino', 'Treino', '<path d="M2 12h2M20 12h2M6 7v10M18 7v10M4 9v6M20 9v6M6 12h12"/>'],
  ['financas', 'Finanças', '<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/>'],
  ['progresso', 'Progresso', '<path d="M3 20h18M5 16l4-5 4 3 6-8"/>'],
];
const VIEWS = { hoje: vHoje, dieta: vDieta, treino: vTreino, financas: vFin, progresso: vProgresso, ajustes: vAjustes };
function render() {
  const emWiz = !S.onboarded || wiz;
  if (!S.onboarded && !wiz) wiz = { ids: STEPS.map(s => s.id), i: 0 };
  document.getElementById('tabs').hidden = !S.onboarded || !!wiz;
  document.getElementById('tabs').innerHTML = TABS.map(([id, l, ic]) => `<button data-act="tab" data-tab="${id}" ${S.ui.tab === id ? 'aria-current="page"' : ''}><svg viewBox="0 0 24 24">${ic}</svg>${l}</button>`).join('');
  document.getElementById('view').innerHTML = emWiz ? vWizard() : (VIEWS[S.ui.tab] || vHoje)();
}
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2200); }
const novaChave = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

let timerH = null;
function iniciarTimer(s) {
  const el = document.getElementById('timer'); clearInterval(timerH); let r = s; el.hidden = false;
  const draw = () => { el.innerHTML = `<span>Descanso ${Math.floor(r / 60)}:${String(r % 60).padStart(2, '0')}</span><button data-act="timerStop">parar</button>`; };
  draw();
  timerH = setInterval(() => { r--; if (r <= 0) { clearInterval(timerH); el.innerHTML = '<span>Próxima série</span><button data-act="timerStop">ok</button>'; try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {} return; } draw(); }, 1000);
}

const ACTIONS = {
  tab: b => { S.ui.tab = b.dataset.tab; confirmApagar = false; save(); render(); window.scrollTo(0, 0); },
  wizBack: () => { wiz.i = Math.max(0, wiz.i - 1); render(); window.scrollTo(0, 0); },
  wizCancel: () => { wiz = null; render(); },
  refazer: b => startWizard(b.dataset.s ? b.dataset.s.split(',') : null),
  abrirTreino: b => { S.ui.treinoSel = b.dataset.id; S.ui.tab = 'treino'; save(); render(); window.scrollTo(0, 0); },
  treinoSel: b => { S.ui.treinoSel = b.dataset.id; save(); render(); },
  swap: b => { const k = hoje() + b.dataset.slot; S.ui.swaps[k] = (S.ui.swaps[k] || 0) + 1; save(); render(); },
  lac: b => { const v = +b.dataset.v; S.logs.lactose[hoje()] = v === 0 ? 0 : (S.logs.lactose[hoje()] || 0) + v; save(); render(); },
  timer: b => iniciarTimer(+b.dataset.s),
  timerStop: () => { clearInterval(timerH); document.getElementById('timer').hidden = true; },
  mes: b => { const d = +b.dataset.d; S.ui.mes = d === 0 ? mesAtual() : addMes(S.ui.mes || mesAtual(), d); save(); render(); },
  lancarFixos: () => { const m = S.ui.mes || mesAtual(); const fx = S.fin.fixos || {};
    FIXOS.forEach(([k, l, cat]) => { if (+fx[k]) S.logs.gastos.push({ k: novaChave(), data: m + '-01', desc: l.split(' (')[0] + ' (fixo)', valor: +fx[k], cat }); });
    if (+S.fin.dividaParcela) S.logs.gastos.push({ k: novaChave(), data: m + '-01', desc: 'Parcelas de dívidas (fixo)', valor: +S.fin.dividaParcela, cat: 'dividas' });
    S.logs.fixosLancados = [...(S.logs.fixosLancados || []), m]; save(); render(); toast('Gastos fixos lançados'); },
  rmGasto: b => { S.logs.gastos = S.logs.gastos.filter(x => x.k !== b.dataset.k); save(); render(); },
  rmSessao: b => { S.logs.treinos = S.logs.treinos.filter(x => x.k !== b.dataset.k); save(); render(); },
  rmCorpo: b => { S.logs.corpo = S.logs.corpo.filter(x => x.data !== b.dataset.d); save(); render(); },
  rmReintro: b => { S.logs.reintro.splice(+b.dataset.i, 1); save(); render(); },
  ajuste: b => { S.perfil.ajusteKcal = (+S.perfil.ajusteKcal || 0) + (+b.dataset.d); S.perfil.ultimoAjuste = hoje(); save(); render(); toast('Calorias ajustadas'); },
  ajusteZero: () => { S.perfil.ajusteKcal = 0; S.perfil.ultimoAjuste = null; save(); render(); },
  exportar: () => { try { const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `evolucao-backup-${hoje()}.json`; document.body.appendChild(a); a.click(); a.remove(); toast('Backup gerado'); } catch (e) { toast('Não foi possível baixar. Use "Copiar dados".'); } },
  copiar: () => { const txt = JSON.stringify(S); const ta = document.getElementById('f-imp');
    navigator.clipboard?.writeText(txt).then(() => toast('Dados copiados. Cole num bloco de notas.'), () => { ta.value = txt; ta.select(); toast('Selecionei os dados na caixa abaixo: copie manualmente.'); }) ?? (ta.value = txt, ta.select()); },
  apagar: () => { if (!confirmApagar) { confirmApagar = true; render(); return; } try { localStorage.removeItem(KEY); } catch (e) {} S = JSON.parse(JSON.stringify(DEFAULT)); confirmApagar = false; wiz = null; render(); },
};
const FORMS = {
  wiz: fd => { STEPS.find(s => s.id === wiz.ids[wiz.i]).read(fd);
    if (wiz.i < wiz.ids.length - 1) { wiz.i++; save(); render(); window.scrollTo(0, 0); return; }
    const primeira = !S.onboarded; S.onboarded = true; wiz = null; if (primeira) S.ui.tab = 'hoje'; save(); render(); window.scrollTo(0, 0); toast('Plano atualizado'); },
  pesoRapido: fd => { const p = num(fd.get('peso')); if (!p) return; const u = S.logs.corpo.find(x => x.data === hoje()); if (u) u.peso = p; else S.logs.corpo.push({ data: hoje(), peso: p }); save(); render(); toast('Peso salvo'); },
  corpo: fd => { const e = { data: fd.get('data') || hoje() }; ['peso', 'cintura', 'pescoco', 'quadril'].forEach(k => { const v = num(fd.get(k)); if (v) e[k] = v; });
    lerBio(fd, e); if (e.gordura) S.perfil.gordura = e.gordura;
    S.logs.corpo = S.logs.corpo.filter(x => x.data !== e.data).concat(e); save(); render(); toast(temBio(e) ? 'Bioimpedância salva, plano recalculado' : 'Medição salva'); },
  sessao: (fd, f) => { const id = f.dataset.id, tr = programa()[id], ex = {};
    tr.ex.forEach(e => { const sets = []; for (let i = 0; i < e.sets; i++) { const kg = num(fd.get(`kg-${e.id}-${i}`)), reps = num(fd.get(`rp-${e.id}-${i}`)); if (reps) sets.push({ kg: kg || 0, reps }); } if (sets.length) ex[e.id] = sets; });
    if (!Object.keys(ex).length) { toast('Preencha as repetições de pelo menos uma série'); return; }
    S.logs.treinos.push({ k: novaChave(), data: fd.get('data') || hoje(), id, ex }); save(); render(); window.scrollTo(0, 0); toast(`Treino ${id} salvo`); },
  gasto: fd => { const v = num(fd.get('valor')); if (!v) return; const pg = fd.get('pg') || 'conta', data = fd.get('data') || hoje(), parc = pg === 'conta' ? 1 : +fd.get('parc') || 1;
    S.logs.gastos.push({ k: novaChave(), data, desc: (fd.get('desc') || '').trim(), valor: v, cat: fd.get('cat'), pg, parc }); S.ui.ultPg = pg; save(); render();
    const c = cartaoPor(pg); toast(c ? `Na fatura que vence em ${fmtData(diaVenc(mesFatura(data, c), +c.vence))}` : 'Lançamento adicionado'); },
  meta: (fd, f) => { const m = S.fin.metas[+f.dataset.i]; m.guardado = (+m.guardado || 0) + (num(fd.get('v')) || 0); save(); render(); toast('Valor somado à meta'); },
  reintro: fd => { S.logs.reintro.push({ data: hoje(), grupo: fd.get('grupo'), alimento: (fd.get('alimento') || '').trim(), reacao: fd.get('reacao') }); save(); render(); toast('Resultado salvo'); },
  importar: fd => { try { const r = JSON.parse(fd.get('json')); if (!r || typeof r !== 'object' || !('perfil' in r)) throw 0; S = merge(r); save(); wiz = null; render(); toast('Backup restaurado'); } catch (e) { toast('Esse conteúdo não é um backup válido do app.'); } },
};
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && ACTIONS[b.dataset.act]) { e.preventDefault(); ACTIONS[b.dataset.act](b, e); } });
document.addEventListener('submit', e => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); FORMS[f.dataset.form](new FormData(f), f); });
document.addEventListener('input', e => { const f = e.target.closest && e.target.closest('form[data-form="gasto"]'); if (!f) return;
  const fd = new FormData(f), h = document.getElementById('onde-cai'); if (h) h.innerHTML = ondeCai(fd.get('data'), fd.get('pg'), fd.get('pg') === 'conta' ? 1 : fd.get('parc')); });
document.addEventListener('change', e => { if (e.target.id === 'f-impfile' && e.target.files[0]) { const rd = new FileReader(); rd.onload = () => { document.getElementById('f-imp').value = rd.result; }; rd.readAsText(e.target.files[0]); } });

render();
</script>
</body>
</html>
